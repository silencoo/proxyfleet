name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check startup and Compose configuration
        run: |
          python3 tests/deployment/start_test.py
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
      - name: Build container
        run: docker build -t proxyfleet:smoke .
      - name: Verify API writes and persistence across container replacement
        run: python3 tests/deployment/persistence_smoke.py --image proxyfleet:smoke

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test default build
        run: go test ./...
      - name: Test full release capabilities
        run: go test -tags "with_utls with_quic with_grpc with_wireguard with_gvisor with_clash_api" ./...

  webui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:webui
      - run: npm run build:webui
      - name: Verify embedded WebUI is current
        run: git diff --exit-code -- webui/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
