name: Socket safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  socket-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pool and Job regression tests
        run: go test -timeout 5m ./internal/outbound/pool ./internal/jobs
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -timeout 5m ./internal/outbound/pool ./internal/jobs
