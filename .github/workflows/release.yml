name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GO_VERSION_FILE: go.mod

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Run full test suite
        run: go test ./...

      - name: Verify full-tag build compiles
        run: go test -tags "$(cat scripts/build-tags.txt)" ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install WebUI browser test dependencies
        run: npm ci

      - name: Test unified build entry point
        run: npm run test:build

      - name: Type-check and build embedded WebUI
        run: npm run check:webui && npm run build:webui

      - name: Verify embedded WebUI is current
        run: git diff --exit-code -- webui/dist

      - name: Run Chromium WebUI regression tests
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Build and inspect official binaries
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build:release -- --skip-webui --version "${{ steps.release.outputs.tag }}"
          windows_sha256="$(sha256sum dist/proxyfleet.exe | awk '{print $1}')"
          linux_sha256="$(sha256sum dist/proxyfleet-linux-amd64 | awk '{print $1}')"
          echo "windows_sha256=${windows_sha256}" >> "${GITHUB_OUTPUT}"
          echo "linux_sha256=${linux_sha256}" >> "${GITHUB_OUTPUT}"
          {
            echo "### ProxyFleet ${{ steps.release.outputs.tag }}"
            echo "- Windows amd64: \`proxyfleet.exe\` - \`${windows_sha256}\`"
            echo "- Linux amd64: \`proxyfleet-linux-amd64\` - \`${linux_sha256}\`"
            echo "- Checksums: \`SHA256SUMS.txt\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          WINDOWS_SHA256: ${{ steps.build.outputs.windows_sha256 }}
          LINUX_SHA256: ${{ steps.build.outputs.linux_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Official ProxyFleet Windows and Linux amd64 builds.

          - Full QUIC, gRPC, WireGuard, gVisor, uTLS and Clash API capabilities
          - Windows amd64: \`proxyfleet.exe\` - SHA256 \`${WINDOWS_SHA256}\`
          - Linux amd64: \`proxyfleet-linux-amd64\` - SHA256 \`${LINUX_SHA256}\`
          - Checksums: \`SHA256SUMS.txt\`
          EOF
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/proxyfleet.exe dist/proxyfleet-linux-amd64 dist/SHA256SUMS.txt dist/build-manifest.json --clobber
            gh release edit "${RELEASE_TAG}" --title "ProxyFleet ${RELEASE_TAG}" --notes-file release-notes.md --latest
          else
            gh release create "${RELEASE_TAG}" dist/proxyfleet.exe dist/proxyfleet-linux-amd64 dist/SHA256SUMS.txt dist/build-manifest.json --verify-tag --title "ProxyFleet ${RELEASE_TAG}" --notes-file release-notes.md --generate-notes --latest
          fi
