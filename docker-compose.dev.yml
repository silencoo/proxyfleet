services:
  proxyfleet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: proxyfleet:dev
    container_name: proxyfleet_dev
    restart: unless-stopped
    # macOS 不支持 network_mode: host，必须使用端口映射
    ports:
      - "2323:2323"       # Pool 入口
      - "9091:9091"       # WebUI
      - "24000-24100:24000-24100"  # Multi-port
    environment:
      PROXYFLEET_UID: ${PROXYFLEET_UID:-10001}
      PROXYFLEET_GID: ${PROXYFLEET_GID:-10001}
    volumes:
      - ${PROXYFLEET_DATA_DIR:-./data}:/etc/proxyfleet
      - ./logs:/app/logs
